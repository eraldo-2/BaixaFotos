name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BaixaFotos-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar APK na página de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BaixaFotos.apk
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao BaixaFotos.apk \
            --title "BaixaFotos (última versão)" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}."
